<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="session-base" content="{{ session_base }}">
  <title>LINE APNG Studio</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">LOCAL ONLY</p>
      <h1>LINE APNG Studio</h1>
      <p>動画はこのMac内だけで処理され、外部へ送信されません。</p>
    </div>
    <div class="header-tools">
      <button type="button" id="checkUpdateButton">更新を確認</button>
      <div class="privacy">このMac限定・v{{ app_version }}<br><strong>起動ごとの専用鍵で保護</strong></div>
    </div>
  </header>

  <main>
    <section class="card source-card">
      <h2>1. 動画を選ぶ</h2>
      <div class="drop">
        <input id="videoInput" type="file" accept="video/*">
        <button type="button" id="chooseVideoButton">動画を選択</button>
        <span id="fileLabel">まだ選択されていません</span>
        <small>MOV / MP4など・最大2GB。選択後、Mac内でプレビューを準備します。</small>
        <p id="sourceStatus" aria-live="polite"></p>
      </div>
    </section>

    <section class="workspace hidden" id="workspace">
      <div class="preview-column">
        <section class="card sticky">
          <h2>2. 使う場所を確認</h2>
          <div class="preview-stage" id="previewStage">
            <div id="videoViewport"><video id="preview" muted playsinline></video></div>
            <canvas id="previewEffect" width="320" height="270"></canvas>
            <div class="preview-caption" id="previewCaption">おはよう！</div>
          </div>
          <div class="play-controls">
            <button type="button" id="playSelection">選択区間を再生</button>
            <span id="timeReadout">0.0秒</span>
          </div>
          <p class="hint">人物が中央に来るよう「横位置・縦位置・ズーム」を調整します。</p>
        </section>
      </div>

      <section class="card settings-column">
        <h2>3. 8個のスタンプを設定</h2>
        <div class="tabs" id="tabs"></div>
        <div id="slotEditor"></div>
        <div class="frame-picker">
          <div class="picker-title"><strong>動くフレーム</strong><span id="selectedFrameName"></span></div>
          <div class="frame-categories" id="frameCategories"></div>
          <div class="frame-grid" id="frameGrid"></div>
        </div>
        <div class="layout-picker">
          <div class="picker-title"><strong>輪郭を選ぶ（装飾とは別に変更できます）</strong><span id="selectedLayoutName"></span></div>
          <div class="layout-grid" id="layoutGrid"></div>
        </div>
        <div class="actions">
          <label class="confirm"><input type="checkbox" id="privacyCheck"> 顔・氏名・住所・制服など、公開したくない情報が映っていないことを確認した</label>
          <button type="button" class="primary" id="renderButton">8個を自動生成してZIP保存</button>
          <p id="status" aria-live="polite"></p>
        </div>
      </section>
    </section>
  </main>

  <div class="update-panel hidden" id="updatePanel" role="status" aria-live="polite">
    <strong id="updateTitle">更新を確認しています</strong>
    <p id="updateMessage">動画は送信されません。</p>
    <div class="update-actions">
      <button type="button" id="closeUpdateButton">閉じる</button>
      <button type="button" class="primary compact hidden" id="installUpdateButton">署名を確認して更新</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
